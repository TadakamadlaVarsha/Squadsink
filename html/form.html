<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!DOCTYPE html>
<html>
<head>
  <title>HTML5 Form Example</title>
</head>
<body>
  <form>
<h3>REGISTRATION FORM</h3>
<label for="firstname">first name:</label>
  <input type="text" id="firstname" name="firtsname" required ><br><br>

<label for="lastname">lastname:</label>
  <input type="text" id="lastname" name="lastname"><br><br>

<label for="email">email: </label>
  <input type="text" id="email" name="email" required><br><br>

<label for="password">password: </label>
  <input type="email" id="password" name="password" required><br><br>

  <label for="gender">gender:</label>
  <label for="male">male</label>
  <input type="radio" name="gender" id="male" >
  <label for="female">female</label>
  <input type="radio" id="female" name="gender" >
  <label for="others">others</label>
  <input type="radio" id="others" name="gender"><br><br>

  <label for="dob">dob</label>
 <input type="date" id="dob" name="dob"><br><br>
 <label for="resume">upload resume</label>
 <input type="file" id="resume" name="resume" accept=".pdf,.DOCTYPE"><br><br>
     <button type="reset">Reset</button>
     <button type="submit">submit</button>
  </form>
</body>
</html>
